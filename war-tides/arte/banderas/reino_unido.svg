<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" role="img" aria-label="White Ensign de la Royal Navy">
  <!-- White Ensign: cruz de San Jorge sobre blanco y la Union Jack en el cantón -->
  <rect width="450" height="300" fill="#fff"/>
  <g fill="#c8102e"><rect x="190" width="70" height="300"/><rect y="115" width="450" height="70"/></g>
  <svg x="0" y="0" width="225" height="150" viewBox="0 0 60 30">
    <clipPath id="c"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
    <clipPath id="t"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
    <g clip-path="url(#c)">
      <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
      <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
      <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t)" stroke="#c8102e" stroke-width="4"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
      <path d="M30,0 v30 M0,15 h60" stroke="#c8102e" stroke-width="6"/>
    </g>
  </svg>
</svg>
